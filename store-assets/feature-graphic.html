<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #240c31;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .canvas {
      position: relative;
      width: 1024px;
      height: 500px;
      background: 
        radial-gradient(circle at 85% 15%, rgba(241, 162, 210, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(165, 159, 245, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(217, 84, 178, 0.12) 0%, transparent 70%),
        linear-gradient(135deg, #230c30 0%, #3a194b 45%, #562a6d 80%, #683582 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
    }
    /* Ambient glow elements */
    .glow-circle-1 {
      position: absolute;
      top: -60px;
      right: 120px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231, 121, 201, 0.28) 0%, rgba(155, 138, 242, 0.08) 60%, transparent 75%);
      pointer-events: none;
    }
    .glow-circle-2 {
      position: absolute;
      bottom: -80px;
      left: 60px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 159, 245, 0.22) 0%, rgba(104, 63, 128, 0.1) 60%, transparent 75%);
      pointer-events: none;
    }
    .content-container {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 52px;
      max-width: 900px;
      width: 100%;
    }
    .icon-wrapper {
      flex-shrink: 0;
      width: 190px;
      height: 190px;
      border-radius: 46px;
      box-shadow: 
        0 20px 48px rgba(0, 0, 0, 0.45),
        0 4px 12px rgba(231, 121, 201, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ea85cd 0%, #9f8cf4 100%);
      position: relative;
    }
    .icon-svg {
      width: 190px;
      height: 190px;
      border-radius: 46px;
    }
    .text-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #ffffff;
    }
    .brand-title {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      margin-bottom: 12px;
    }
    .brand-title span {
      background: linear-gradient(135deg, #fce0f1 0%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline-en {
      font-size: 25px;
      font-weight: 600;
      color: #f7bde4;
      letter-spacing: -0.2px;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .tagline-ar {
      font-size: 21px;
      font-weight: 500;
      color: #e5d9f3;
      direction: rtl;
      text-align: left;
      line-height: 1.3;
      opacity: 0.95;
    }
    /* Subtle accent stars */
    .sparkle {
      position: absolute;
      color: rgba(241, 162, 210, 0.65);
      font-size: 20px;
      user-select: none;
    }
    .sparkle-1 { top: 90px; left: 70px; font-size: 26px; }
    .sparkle-2 { bottom: 100px; right: 90px; font-size: 22px; color: rgba(165, 159, 245, 0.7); }
    .sparkle-3 { top: 75px; right: 280px; font-size: 18px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="glow-circle-1"></div>
    <div class="glow-circle-2"></div>
    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✦</div>
    <div class="sparkle sparkle-3">✦</div>

    <div class="content-container">
      <div class="icon-wrapper">
        <svg class="icon-svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="nest" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ea85cd" />
              <stop offset="1" stop-color="#9f8cf4" />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="118" fill="url(#nest)" />
          <!-- House & Heart vector path -->
          <path d="M102 244 256 116l154 128v139a23 23 0 0 1-23 23H125a23 23 0 0 1-23-23Z" fill="#ffffff" />
          <path d="M206 406V292a50 50 0 0 1 100 0v114" fill="#c866b8" />
          <path d="M256 270c-9-16-36-13-36 8 0 19 36 39 36 39s36-20 36-39c0-21-27-24-36-8Z" fill="#ffffff" />
        </svg>
      </div>

      <div class="text-column">
        <h1 class="brand-title"><span>CareNest</span></h1>
        <p class="tagline-en">Babysitter &amp; Caregiver Booking</p>
        <p class="tagline-ar">حجز جليسات الأطفال ورعاية العائلة</p>
      </div>
    </div>
  </div>
</body>
</html>
